# Network-wide default dependency_check patterns, keyed by exact L1 output
# variable name. Same shape/validation as a site's own L2 config
# (services.metadata.qc_config_schema.validate_qc_config_structure). Merged
# into every site's resolved QC config by qc_config_schema.resolve_qc_config,
# which silently drops any entry -- or individual dependency_check source --
# not present in that site's real L1 store. This is what exempts
# EddyPro-only sites (no Diag_SONIC/Diag_IRGA/raw covariances) from Groups
# A/B with no site-name or instrument-type branching in code.
#
# _Vr variants omitted throughout (never reach the L1 store under that name
# -- see variable_registry.canonical_output_name). Vertical-velocity
# conditional is Uz_SONIC_Sd only, never W_SONIC_Sd (different physical
# quantities here -- sonic-instrument-frame vs rotated/meteorological-frame
# -- and this pipeline has no rotation stage).

# --- Group A: SONIC-implicit dependency check (ported from PyFluxPro's
# do_SONICcheck, pfp_ck.py -- its own docstring calls it "an implicit
# dependency check using the sonic diagnostic") ---
#
# PROVISIONAL: [0, 500] is a flat invalid-sample-count bound, not normalized
# for sample rate -- the network runs a mix of 10 Hz (26 sites) and 20 Hz
# (8 sites) sampling, so this is roughly twice as strict in
# percentage-of-interval terms at 20 Hz sites. freq_hz isn't available in
# the L1 store's own ds.attrs (only time_step is) -- normalizing properly
# would mean piping freq_hz through as a new TERN-adapter-supplied field,
# deferred by explicit user decision.
Diag_SONIC:
  range_check: {lower: 0, upper: 500}

UxT: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
UxUy: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
UxUz: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
Ux_SONIC_Av: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
Ux_SONIC_Sd: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
UyT: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
UyUz: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
Uy_SONIC_Av: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
Uy_SONIC_Sd: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
UzT: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
Uz_SONIC_Av: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
Tv_SONIC_Av: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
U_SONIC_Av: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
U_SONIC_Sd: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
V_SONIC_Av: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
V_SONIC_Sd: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
W_SONIC_Av: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}
W_SONIC_Sd: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd]}

# --- Group B: IRGA-implicit dependency check (ported from PyFluxPro's
# do_IRGAcheck/do_li7500check/do_EC155check, pfp_ck.py -- same "implicit
# dependency check" pattern, gated on the IRGA diagnostic instead) ---
#
# Same PROVISIONAL [0, 500] sample-rate caveat as Diag_SONIC above.
#
# Signal-strength conditional lists every real variant name in the network
# (SigCO2_IRGA/SigH2O_IRGA at compound-signal EC150/EC155/IRGASON sites,
# Sig_IRGA at single-channel LI-7500-family sites -- see the Sig_IRGA
# naming fix that preceded this file). Existence-gating keeps only
# whichever exist at a given site, reproducing PyFluxPro's own
# multi-candidate probing without per-site code.
#
# UzA/UxA/UyA/UzC/UxC/UyC are wind x concentration covariances -- genuine
# dependents of BOTH the SONIC and IRGA checks (need a good sonic AND a
# good IRGA), so their dependency_check here is the union of both groups'
# conditionals rather than living in Group A above (QCConfigSchema is a
# flat {var: spec} map -- one entry per variable, not one per group).
Diag_IRGA:
  range_check: {lower: 0, upper: 500}

UzA: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd, Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
UxA: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd, Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
UyA: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd, Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
UzC: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd, Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
UxC: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd, Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
UyC: {dependency_check: [Diag_SONIC, Uz_SONIC_Sd, Tv_SONIC_Sd, Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
AH_IRGA_Av: {dependency_check: [Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
AH_IRGA_Sd: {dependency_check: [Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
CO2_IRGA_Av: {dependency_check: [Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
CO2_IRGA_Sd: {dependency_check: [Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
CO2c_IRGA_Av: {dependency_check: [Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}
H2O_IRGA_Av: {dependency_check: [Diag_IRGA, H2O_IRGA_Sd, CO2c_IRGA_Sd, SigCO2_IRGA, SigH2O_IRGA, Sig_IRGA]}

# --- Group C: EddyPro/EasyFlux flux QC-flag pattern ---
# Precedent extracted directly from PyFluxPro's own CumberlandPlain control
# file (source: /home/imchugh/Documents/L2_files/L2_autogen_CumberlandPlain
# .txt, lines ~31-50): DependencyCheck exists there only for Fco2/Fe
# (compound sonic+irga fluxes); Fh/Fm (sonic-only) have their _QC flag
# range-checked but no DependencyCheck wired to the flux itself. Ported
# faithfully.
#
# PROVISIONAL: both the [-0.5, 1.5] bound and the Fh/Fm omission rest on
# this one site's extracted precedent -- worth checking against the other 5
# EasyFlux sites' real flag conventions (MyallValeA, MyallValeB,
# SilverPlains, SnowGum, Wedgetail -- confirmed all 6 of these sites carry
# uniform Fco2_QC/Fe_QC/Fh_QC/Fm_QC companions) once there's real flagged
# output to inspect.
#
# No range_check needed here for Fco2/Fe/Fh/Fm themselves -- those already
# have quantity-level bounds in _range_defaults.yml and get picked up
# automatically by the field-level merge for any site lacking its own
# override, same as every other quantity.
Fco2_QC: {range_check: {lower: -0.5, upper: 1.5}}
Fe_QC: {range_check: {lower: -0.5, upper: 1.5}}
Fh_QC: {range_check: {lower: -0.5, upper: 1.5}}
Fm_QC: {range_check: {lower: -0.5, upper: 1.5}}

Fco2: {dependency_check: [Fco2_QC, SigCO2_IRGA, Sig_IRGA, AH_IRGA_Sd]}
Fe: {dependency_check: [Fe_QC, SigCO2_IRGA, Sig_IRGA, AH_IRGA_Sd]}
