pitch: [0, 90]                    # migrated from canonical_quantities.yml
ps: [95, 105]

roll: [0, 90]                     # migrated from canonical_quantities.yml

tau: [0, 5]                       # migrated from canonical_quantities.yml
ustar: [0, 5]                     # migrated from canonical_quantities.yml
