# Default L2 range_check bounds, per canonical quantity: [min, max].
#
# The single source of value ranges (L2 QC, and in the TERN pipeline the
# RTMC export and site monitors). A site's own range_check overrides these
# field by field.
#
# Keying, by the variable's quantity:
#   - [min, max] directly under the quantity;
#   - nested by statistic suffix (Av / Sd / Vr), from the variable's
#     statistic_type attr, where bounds differ by statistic. Sd and Vr are
#     both given (Sd = sqrt(Vr)), lower bound 0;
#   - Diag: nested by instrument qualifier (IRGA / SONIC) -- unrelated
#     instrument codes that only share a name;
#   - ps: `standard_pressure_pm: N` = standard-atmosphere pressure at the
#     site's elevation +/- N kPa; no elevation, no default.
#
# Sources: unmarked bounds are PyFluxPro's OzFlux template
# (site_configs/templates/L2_ozflux.txt); "PFP sites" marks the value most
# sites' own PyFluxPro configs used; "migrated" marks the old
# canonical_quantities.yml valid_min/valid_max, never vetted against data.
# Departures from source:
#   - Ux/Uy/Uz Vr: PyFluxPro's negative lower bound set to 0.
#   - CO2/CO2c: PyFluxPro's "CO2_IRGA_Av" is mass concentration, so its
#     bounds are CO2c's; CO2 (mole fraction) has its own.
#   - AGC: absent; the raw "AGC" columns are signal strength (Sig).
#   - Diag: a count of flagged scans (0-18000 per 30 min at 10 Hz), not
#     PyFluxPro's averaged bit count. Failures are bimodal, so the cutoff
#     isn't sensitive; it isn't scaled for 20 Hz sites.

AH:
  Av: [0, 30]                   # PFP sites
  Sd: [0, 2]                    # PFP sites
  Vr: [0, 4]

CO2:                              # mole fraction (umol/mol)
  Av: [350, 1500]                 # migrated
  Sd: [0, 20]                     # Calperum CO2_IRGA_Sd: 98% <= 20
  Vr: [0, 400]

CO2c:                             # mass concentration (mg/m^3)
  Av: [500, 2000]
  Sd: [0, 25]                   # PFP sites
  Vr: [0, 625]

Diag:
  IRGA: [0, 500]
  SONIC: [0, 500]

ER: [0, 30]                       # migrated

FAPAR: [0, 1]                     # migrated
Fa: [-300, 1000]                  # migrated
Fco2: [-50, 50]                   # PFP sites
Fe: [-100, 600]                   # PFP sites
Fg: [-100, 150]
Fh: [-100, 600]                   # PFP sites
Fld: [200, 700]                   # PFP sites
Flu: [200, 700]                   # PFP sites
Fm: [0, 5]                        # migrated (as tau)
Fn: [-100, 1000]
Fqd: [-40, 3000]                  # PAR, umol/m^2/s
Fqu: [-40, 1000]
Fsd: [-10, 1500]
FsdDiff: [-20, 1412]              # migrated
FsdDir: [-20, 1412]               # migrated
Fsu: [-10, 500]

GPP: [-60, 0]                     # migrated

H2O: [0, 80]                      # migrated (was reversed there)

NEE: [-50, 30]                    # migrated
NEP: [-50, 30]                    # migrated

Precip: [0, 50]

RH: [0, 110]
RHint: [0, 100]                   # migrated
Rhoa: [0.4, 1.4]                  # migrated
Rhod: [0.6, 1.6]                  # migrated

Sig: [80, 102.5]                  # signal strength moves in 6.25 steps; the ~75 level is noisy at every
SigCO2: [80, 102.5]               # site, so all three exclude it
SigH2O: [80, 102.5]
SVP: [0.25, 12.5]                 # kPa: saturation VP over Ta [-10, 50]
VP: [0, 12.5]                     # can't exceed saturation VP
Swp: [-10000, 0]                  # migrated
Sws: [0.001, 1.0]                 # 1 = free water (peat reaches 0.9); exactly 0 is a stuck or disconnected probe

Ta: [-10, 50]
Tbody: [-40, 60]                  # migrated
Tcanopy: [-40, 60]                # migrated
Td: [-65, 40]                     # migrated
Tint: [-40, 60]                   # migrated
Tpanel: [-20, 60]
Ts: [0, 60]
Tstar: [-50, 50]                  # migrated

Tv:
  Av: [-10, 50]
  Sd: [0, 3]                     # PFP sites
  Vr: [0, 9]

Ux:
  Av: [-20, 20]
  Sd: [0, 3]                     # PFP sites
  Vr: [0, 9]

Uy:
  Av: [-20, 20]
  Sd: [0, 3]                     # PFP sites
  Vr: [0, 9]

Uz:
  Av: [-1, 1]
  Sd: [0, 1.5]                   # PFP sites
  Vr: [0, 2.25]

UxA: [-1, 1]
UxC: [-4, 4]
UxT: [-2, 2]
UxUy: [-1, 1]
UxUz: [-10, 10]

UyA: [-1, 1]
UyC: [-4, 4]
UyT: [-2, 2]
UyUz: [-10, 10]

UzA: [-0.01, 0.5]
UzC: [-2, 2]
UzT: [-0.2, 1]

Vbat: [0, 15]

Wd:
  Av: [0, 360]
  Sd: [0, 360]

Ws:
  Av: [0, 20]
  Sd: [0, 20]

pitch: [0, 90]                    # migrated
ps:                               # station pressure (kPa)
  standard_pressure_pm: 10

roll: [0, 90]                     # migrated

ustar: [0, 5]                     # migrated
